# Values for the official MLflow chart (oci://ghcr.io/mlflow/charts/mlflow).
#
# Setup order:
#   1. Create the "mlflow" namespace and mlflow-db-credentials secret, then
#      `kubectl apply -f mlflow-postgres.yaml` (see comments in that file).
#   2. Create the mlflow-db-secret referenced below:
#        kubectl create secret generic mlflow-db-secret -n mlflow \
#          --from-literal=uri="postgresql://mlflow:<password>@mlflow-postgres:5432/mlflow"
#   3. helm upgrade --install mlflow oci://ghcr.io/mlflow/charts/mlflow \
#        --namespace mlflow --create-namespace -f mlflow-values.yaml

# Backs the artifact store with a PVC on k3s's default "local-path"
# StorageClass, i.e. a directory on the host node's disk.
storage:
  enabled: true
  size: 10Gi
  storageClassName: "local-path"

# Exposes the MLflow UI as a NodePort so it's reachable at
# danielhamill.me:<nodePort>. The chart doesn't support pinning an exact
# nodePort, so Kubernetes auto-assigns one from 30000-32767 — after
# deploying, run `kubectl get svc -n mlflow` to see which port it picked.
service:
  type: NodePort

# MLflow 2.14+ rejects requests whose Host header isn't localhost or a
# private IP (DNS-rebinding protection), so accessing the UI via
# danielhamill.me needs an explicit allowlist entry. The ":*" variant
# matches the NodePort's port number (Host headers include the port when
# it isn't 80/443). Health/readiness probes hit /health, which is exempt
# from this check, so this is safe to set without breaking the pod.
#
# allowed_hosts only covers the Host header. Separately, MLflow's
# CORSBlockingMiddleware rejects any state-changing request (POST/PUT/
# PATCH/DELETE) whose Origin header isn't localhost and isn't in
# cors_allowed_origins -- which defaults to empty, i.e. blocks everything
# non-localhost. Browsers send Origin on fetch POSTs (e.g. the UI's
# runs/search call used to list runs on the experiment page); curl
# doesn't unless told to, which is why "GET run" worked but "POST
# search runs" came back 403 (surfaced in the UI as INTERNAL_ERROR).
# Origin values include the scheme, so this needs "http://" unlike
# allowed_hosts.
server:
  value_options:
    allowed_hosts: "danielhamill.me,danielhamill.me:*"
    cors_allowed_origins: "http://danielhamill.me:*"

mlflow:
  backendStoreUriFrom:
    secretKeyRef:
      name: mlflow-db-secret
      key: uri
  artifactsDestination: "/mlflow/artifacts"
